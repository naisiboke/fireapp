<script id="engines">
/* FIRE Engine is the only source of computed freedom dates. Financial assumptions are explicit in UI. */
function FireEngine(f){
 const target=f.mode==='goal'?f.goal:f.expense*12/(f.withdrawal/100);
 const monthlySaving=Math.max(0,f.income-f.expense),monthlyRate=Math.pow(1+f.rate/100,1/12)-1;
 let value=f.assets,months=0;
 while(value<target&&months<1200){value=value*(1+monthlyRate)+monthlySaving;months++;}
 const reached=value>=target;
 const date=new Date();if(reached)date.setMonth(date.getMonth()+months);
 return {target,months:reached?months:null,years:reached?(months/12).toFixed(1):null,progress:Math.min(100,Math.max(0,f.assets/target*100)),date:reached?date:null,monthlySaving};
}
function ActionEngine(s,action,id){
 const item=s.items.find(i=>i.id===id);
 if(action==='abandon'&&item&&item.status==='active'){item.status='abandoned';return true;}
 if(action==='buy'&&item&&item.status==='active'){item.status='bought';return true;}
 if(action==='transfer'&&item&&item.status==='abandoned'&&Number.isFinite(item.amount)&&item.amount>0){s.finance.assets+=item.amount;item.status='transferred';return true;}
 if(action==='task'&&!s.completed.includes(id)){const reward={assets:50,savings:80,wishlist:50,read:30}[id];if(!reward)return false;s.exp+=reward;s.completed.push(id);return true;}
 return false;
}
</script>

let toastTimer;function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),2600);}
function go(target,push=true){if(push&&page!==target)historyStack.push(page);page=target;render();window.scrollTo(0,0);}

function completedRow(t){const done=state.completed.includes(t.id);return `<button class="task-row" data-action="task" data-id="${t.id}"><span class="circle-check ${done?'done':''}">${done?'✓':''}</span><div class="text">${t.title}<div class="sub">${done?'已完成':'留一点时间，给未来的自己'}</div></div><span class="reward">${done?'✓':'+'+t.reward+' EXP'}</span></button>`;}

let countdownTimer=null;
function getFreedomPlan(){
 const r=FireEngine(state.finance),signature=JSON.stringify(state.finance),saved=state.freedomPlan;
 if(!saved||saved.signature!==signature||(r.date&&!Number.isFinite(saved.deadline))||(!r.date&&saved.deadline!==null)){
  state.freedomPlan={signature,deadline:r.date?r.date.getTime():null};persist();
 }
 r.date=state.freedomPlan.deadline===null?null:new Date(state.freedomPlan.deadline);
 return r;
}
function updateCountdown(deadline){
 const days=document.querySelector('#freedom-days'),clock=document.querySelector('#freedom-clock');if(!days||!clock)return;
 if(!deadline){days.textContent='—';clock.textContent='100 年内暂未可达';return;}
 const seconds=Math.max(0,Math.ceil((deadline.getTime()-Date.now())/1000)),remainingDays=Math.floor(seconds/86400);
 days.textContent=remainingDays.toLocaleString('zh-CN');
 const pad=n=>String(n).padStart(2,'0');clock.textContent=pad(Math.floor(seconds/3600)%24)+' 时 '+pad(Math.floor(seconds/60)%60)+' 分 '+pad(seconds%60)+' 秒';
}

 case 'add':view.innerHTML=renderTop('工具')+intro('极简拔草','记下想要的，留点时间再决定。')+`<form id="item-form"><div class="form-row"><label for="item-name">名称</label><input id="item-name" name="itemName" maxlength="60" placeholder="你想买什么，或想做什么？" required></div><fieldset class="choice-group"><legend>分类</legend><div class="category-options">${Object.entries(categories).map(([k,[n]],index)=>`<label class="choice-pill"><input type="radio" name="category" value="${k}" ${index===0?'checked':''}><span>${n}</span></label>`).join('')}</div></fieldset><fieldset class="choice-group"><legend>冷静期</legend><div class="cooling-options">${[3,7,30].map(d=>`<label class="choice-pill"><input type="radio" name="days" value="${d}" ${d===7?'checked':''}><span>${d} 天</span></label>`).join('')}</div></fieldset><details class="optional-settings"><summary>更多设置 <span class="sub">预计金额、备注（选填）</span></summary><div class="form-row"><label for="amount">预计金额（选填）</label><div class="input-value"><span class="unit">¥</span><input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" max="100000000" step="0.01" placeholder="填写金额"></div></div><div class="form-row"><label for="note">备注（选填）</label><textarea id="note" name="note" rows="3" maxlength="400" placeholder="它为什么吸引我？"></textarea></div></details><div class="error" id="form-error" role="alert"></div><div class="footer-buttons"><button class="btn" type="submit">加入冷静期</button></div><p class="hint">不需要图片，也不预设具体商品。<br>未填写金额的计划只记录决定，不计入省下金额或资产。</p></form>`;break;
 case 'item':{const i=state.items.find(i=>i.id===currentId);if(!i){go('wishlist',false);return;}view.innerHTML=renderTop('消费计划详情')+`<div class="item-symbol">${categories[i.category][1]}</div><div class="detail-title"><span class="tag">${categories[i.category][0]}</span><h1 style="margin-top:16px">${escapeText(i.name)}</h1><div class="price num">${itemMoney(i.amount)}</div><p class="sub">添加于 ${new Date(i.created).toLocaleDateString('zh-CN')}</p></div><div class="panel"><div class="row"><h3>冷静期 · ${i.days} 天</h3><span class="tag">${i.status==='active'?daysLeft(i)>0?'剩余 '+daysLeft(i)+' 天':'已结束':{abandoned:'已放弃',transferred:'已转入',bought:'已购买'}[i.status]}</span></div><div style="margin-top:20px">${bar(Math.min(100,Math.max(0,(Date.now()-i.created)/(i.days*86400000)*100)))}</div></div><section class="section"><h3 style="margin-bottom:14px">当时的想法</h3><p class="note">${escapeText(i.note||'给自己一点时间，再看看这是不是我真正需要的。')}</p></section>${i.status==='active'?`<div class="two-buttons">${button('放弃 · 记为已省下','abandon','light')}${button('我还是想买','buy-confirm','outline')}</div><p class="hint">你可以提前做决定，也可以等冷静期结束。</p>`:i.status==='abandoned'&&Number.isFinite(i.amount)&&i.amount>0?`<div class="footer-buttons">${button('转入自由基金','transfer-page')}</div><p class="hint">请先完成实际资金安排，再确认计入资产。</p>`:i.status==='abandoned'?`<p class="detail-status note">已记录放弃决定。因为未填写金额，这笔计划不计入省下金额或资产。</p>`:i.status==='transferred'?`<p class="detail-status note">这笔 ${itemMoney(i.amount)} 已计入资产，自由日已重新计算。</p>`:`<p class="detail-status note">购买决定已记录。如已支付，请在财务数据中更新实际资产余额。</p>${button('更新我的财务数据','edit-finance','light')}`}`;break;}
 case 'transfer':{const i=state.items.find(i=>i.id===currentId);if(!i||i.status!=='abandoned'||!Number.isFinite(i.amount)||i.amount<=0){go('wishlist',false);return;}const next=FireEngine({...f,assets:f.assets+i.amount});view.innerHTML=renderTop('转入自由基金')+`<div class="item-symbol">＋</div>`+intro('把一次克制，<br>留给未来的自己。','确认这笔资金已真实留作投资。')+`<div class="panel soft"><span class="sub">本次转入</span><div class="num" style="font-size:44px;margin:13px 0">${money(i.amount)}</div><p>${escapeText(i.name)}</p></div><div class="breakdown"><div class="row"><span class="sub">当前资产</span><span>${money(f.assets)}</span></div><div class="row"><span class="sub">转入后的资产</span><strong>${money(f.assets+i.amount)}</strong></div><div class="row"><span class="sub">重算后的自由日</span><span>${dateText(next.date)}</span></div></div><label class="option" style="margin-top:25px;font-size:14px;line-height:1.7"><input type="checkbox" id="transfer-check"><span>我已将这笔钱留作投资，且当前资产尚未包含这笔金额。</span></label><div class="footer-buttons">${button('确认转入并更新计划','confirm-transfer','', 'id="transfer-btn" disabled')}${button('再想想','back','light')}</div><p class="safe-note">这里只记录资产变化，不进行银行转账。每笔消费计划仅能转入一次。</p>`;break;}
 case 'buy-confirm':view.innerHTML=renderTop('记录购买决定')+intro('想清楚后，<br>也可以选择拥有。','你的选择不需要被评判。')+`<div class="note">确认后，该计划会标记为“已购买”。本原型不会自动扣减资产；支付后请更新实际财务数据。</div><div class="footer-buttons">${button('确认购买决定','buy')}${button('再冷静一下','back','light')}</div>`;break;
 case 'profile':view.innerHTML=renderTop('',false)+intro('我的','好好生活，也好好规划。')+`<div class="profile-name"><span class="avatar">${escapeText(p.name.slice(0,1))}</span><div><h2>${escapeText(p.name)}</h2><p class="sub">${escapeText(p.goal)} · 持续成长</p></div><button data-go="onboarding" class="chevron" style="margin-left:auto" aria-label="编辑个人画像">›</button></div>${[['finance','◷','我的财务数据','资产、收入与支出'],['calculator','◇','我的 FIRE 目标',f.mode==='goal'?'目标储蓄模式':'FIRE 退休模式'],['hero','✧','我的成长',state.exp+' EXP · '+state.completed.length+' 项行动'],['wishlist','＋','我的消费计划',state.items.length+' 笔自己的选择'],['settings','⚙','设置与原型说明','数据保存与演示状态']].map(([route,icon,t,s])=>`<button class="menu-row" data-go="${route}"><span class="iconbox">${icon}</span><div class="text"><h3>${t}</h3><p class="sub">${s}</p></div><span class="chevron">›</span></button>`).join('')}<div class="version">FIRE FORGE · V1.0 手机交互原型</div>`;break;
 case 'settings':view.innerHTML=renderTop('设置与原型说明')+intro('你的数据，<br>留在你的设备。','这一版用于体验界面与交互流程。')+`<div class="panel stack"><h3>当前预览状态</h3><p class="sub">${storageAvailable?'浏览器本地保存已开启，刷新后可继续体验。':'当前浏览器无法使用本地保存，关闭页面后记录可能丢失。'}</p><p class="sub">所有初始金额为演示数据。这份 HTML 不连接银行，不提供账号或云同步。</p><p class="sub">本地数据尚未加密，请用演示数字体验。正式 App 的加密存储将在后续开发中实现。</p></div><div class="section note"><h3>关于计算</h3><p class="sub" style="margin-top:9px">固定收益假设、月度复利、每月投入收入与支出的正结余。最多模拟 100 年，未达标时显示暂未可达。退休目标按提取率计算，画像与 EXP 不直接修改自由日。</p></div><div class="footer-buttons">${button('重新查看启动流程','replay','light')}${button('重置演示数据','reset-page','outline')}</div>`;break;
 case 'reset':view.innerHTML=renderTop('重置演示数据')+intro('重新开始一次体验','这会清除当前浏览器内的消费计划、个人画像与任务记录。')+`<div class="footer-buttons">${button('确认重置为演示数据','reset')}${button('保留当前数据','back','light')}</div>`;break;
 default:go('home',false);
 }
 if(page==='home'){updateCountdown(r.date);if(r.date)countdownTimer=setInterval(()=>updateCountdown(r.date),1000);}
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.go){if(b.dataset.go==='calculator')calcOrigin=page;go(b.dataset.go);return;}
 const a=b.dataset.action,id=b.dataset.id;
 switch(a){
 case 'back':back();break;
 case 'start':calcOrigin='welcome';go('calculator');break;
 case 'skip':case 'enter-home':state.started=true;persist();go('home');break;
 case 'profile-onboarding':go('onboarding');break;
 case 'mode':{const fm=document.querySelector('#finance-form');for(const k of ['assets','expense','income','rate','withdrawal','goal']){const x=fm.elements[k];if(x&&x.value!==''&&x.checkValidity())state.finance[k]=Number(x.value);}state.finance.mode=id;render();break;}
 case 'task':taskId=id;go('task');break;
 case 'task-start':go(tasks.find(t=>t.id===taskId).route);break;
 case 'read-done':doneTask('read');go('hero');break;
 case 'task-tab':taskTab=id;render();break;
 case 'filter':filter=id;render();break;
 case 'add-item':go('add');break;
 case 'item':currentId=id;go('item');break;
 case 'abandon':if(ActionEngine(state,'abandon',currentId)){doneTask('wishlist');persist();render();toast('已记为省下，当前资产未改变');}break;
 case 'transfer-page':go('transfer');break;
 case 'confirm-transfer':if(document.querySelector('#transfer-check').checked&&ActionEngine(state,'transfer',currentId)){persist();filter='transferred';historyStack=[];go('wishlist');toast('已计入资产，自由日已更新');}break;
 case 'buy-confirm':go('buy-confirm');break;
 case 'buy':if(ActionEngine(state,'buy',currentId)){doneTask('wishlist');persist();go('item');}break;
 case 'edit-finance':go('finance');break;
 case 'replay':go('welcome');break;
 case 'reset-page':go('reset');break;
 case 'reset':state=seed();persist();historyStack=[];filter='active';taskTab='today';go('welcome',false);toast('已恢复演示数据');break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='transfer-check')document.querySelector('#transfer-btn').disabled=!e.target.checked;});
document.addEventListener('submit',e=>{
 e.preventDefault();const form=e.target,data=new FormData(form);
 if(form.id==='finance-form'){
 const f={...state.finance};for(const k of ['assets','expense','income','rate','withdrawal','goal'])if(data.has(k))f[k]=Number(data.get(k));
 if(!Object.entries(f).filter(([k])=>k!=='mode').every(([,v])=>Number.isFinite(v))||f.assets<0||f.expense<=0||f.income<0||f.rate<-50||f.rate>50||f.withdrawal<1||f.withdrawal>10||f.goal<=0){document.querySelector('#form-error').textContent='请检查金额、收益率与提取率，输入有效的数字。';return;}
 state.finance=f;state.started=true;doneTask('assets');if(taskId==='savings')doneTask('savings');persist();go(page==='finance'?'home':'result');
 }else if(form.id==='profile-form'){
 const name=String(data.get('name')).trim();if(!name){toast('请填写称呼');return;}state.profile={name,passive:Number(data.get('passive')),goal:String(data.get('lifeGoal')||'工作自由')};state.started=true;persist();go('home');
 }else if(form.id==='item-form'){
 const name=String(data.get('itemName')).trim(),rawAmount=String(data.get('amount')||'').trim(),amount=rawAmount===''?null:Number(rawAmount),category=String(data.get('category')),days=Number(data.get('days'));if(!name||(amount!==null&&(!Number.isFinite(amount)||amount<=0||amount>100000000))||!Object.hasOwn(categories,category)||![3,7,30].includes(days)){document.querySelector('#form-error').textContent='请填写名称；金额如有填写，须大于零。';return;}
 const id='item-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);state.items.push({id,name,amount,category:String(data.get('category')),days:Number(data.get('days')),note:String(data.get('note')||'').trim(),created:Date.now(),status:'active'});persist();filter='active';currentId=id;go('wishlist');toast('已加入清单，给心动一点时间');
 }
});
if(document.modelContext?.registerTool){
 const lifecycle=new AbortController();
 try{Promise.resolve(document.modelContext.registerTool({name:'read_freedom_plan',title:'查看当前自由计划',description:'读取当前设备中的 FIRE 模拟结果，不修改资产、任务或消费计划。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('无需输入参数');const r=getFreedomPlan();return {target:r.target,months:r.months,progress:r.progress,date:dateText(r.date)};}},{signal:lifecycle.signal})).catch(()=>{});}catch(e){}
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
window.addEventListener('pageshow',()=>{if(page==='home'||page==='wishlist'||page==='item')render();});
document.addEventListener('visibilitychange',()=>{if(page==='home'&&!document.hidden)updateCountdown(getFreedomPlan().date);});
render();
</script></body></html>
